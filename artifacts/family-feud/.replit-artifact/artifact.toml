kind = "web"
previewPath = "/"
title = "Family Feud Online"
version = "1.0.0"
id = "artifacts/family-feud"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 5173
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/family-feud run dev"

[services.env]
PORT = "5173"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/family-feud", "run", "build"]
publicDir = "artifacts/family-feud/dist/public"
serve = "static"

