<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D" />
      <stop offset="0.4" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueCore" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA" />
      <stop offset="0.6" stop-color="#2563EB" />
      <stop offset="1" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Thick gold frame -->
  <ellipse cx="50" cy="50" rx="49" ry="39" fill="url(#gold)" />
  
  <!-- Center blue screen -->
  <ellipse cx="50" cy="50" rx="38" ry="28" fill="url(#blueCore)" />
  
  <!-- Inner light blue accent ring -->
  <ellipse cx="50" cy="50" rx="33" ry="23" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.8" />
  
  <!-- Marquee bulbs! Uses dashed thick stroke to create perfect little circular dots -->
  <ellipse cx="50" cy="50" rx="43.5" ry="33.5" fill="none" stroke="#FEF3C7" stroke-width="5" stroke-dasharray="0.1 14" stroke-linecap="round"/>
</svg>
